name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog python3-numpy \
                                  python3-matplotlib build-essential

      - name: Generate ISA package
        run: make docs

      - name: Build simulator
        run: make sim

      - name: Self-test
        run: make selftest

      - name: Unit tests
        run: make test

      - name: Build client
        run: make client

      - name: Run smoke benchmark
        run: make bench
